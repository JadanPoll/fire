name: Build and publish Fire TV lab APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'canvas/**'
      - 'browser/**'
      - 'tools/**'
      - 'catalog.json'
      - 'signing/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'browser/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check remote test helper
        run: |
          python3 -m py_compile tools/firetv_test.py tools/codex_executor.py
          python3 -m unittest discover -s tools -p 'test_codex_executor.py' -v
          python3 tools/firetv_test.py --help >/dev/null
          python3 tools/check_console_manifest.py
      - name: Build APK and release notes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d signing/lab.keystore.base64 > signing/lab.keystore
          gradle --no-daemon :browser:testReleaseUnitTest :app:testReleaseUnitTest :app:assembleRelease :canvas:assembleRelease :browser:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/firetv-dev-bridge.apk
          cp canvas/build/outputs/apk/release/canvas-release.apk dist/firetv-remote-canvas.apk
          cp browser/build/outputs/apk/release/browser-release.apk dist/firetv-browser.apk
          BRIDGE_SHA="$(sha256sum dist/firetv-dev-bridge.apk | cut -d' ' -f1)"
          CANVAS_SHA="$(sha256sum dist/firetv-remote-canvas.apk | cut -d' ' -f1)"
          BROWSER_SHA="$(sha256sum dist/firetv-browser.apk | cut -d' ' -f1)"
          printf 'Version code: %s\nSHA256: %s\nSHA256 firetv-dev-bridge.apk: %s\nSHA256 firetv-remote-canvas.apk: %s\nSHA256 firetv-browser.apk: %s\n' "$GITHUB_RUN_NUMBER" "$BRIDGE_SHA" "$BRIDGE_SHA" "$CANVAS_SHA" "$BROWSER_SHA" > dist/release-notes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: firetv-dev-bridge
          path: |
            dist/firetv-dev-bridge.apk
            dist/firetv-remote-canvas.apk
            dist/firetv-browser.apk
      - name: Publish rolling dev release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv-dev-bridge-latest
          name: Fire Console and Dev Bridge (lab)
          prerelease: true
          make_latest: false
          files: |
            dist/firetv-dev-bridge.apk
            dist/firetv-remote-canvas.apk
            dist/firetv-browser.apk
          body_path: dist/release-notes.txt
          fail_on_unmatched_files: true
