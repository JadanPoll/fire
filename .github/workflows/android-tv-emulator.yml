name: Android TV emulator smoke

# Optional, independent evidence: failures never block main's APK publisher.
# Public GitHub Actions runner + Android TV system image. No cloud test account.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'browser/**'
      - 'canvas/**'
      - 'Applications/**'
      - 'AppOS/Remote/**'
      - 'tools/tv_emulator_smoke.py'
      - '.github/workflows/android-tv-emulator.yml'
      - 'settings.gradle'
      - '*.gradle'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: tv-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build native APKs
        run: |
          base64 -d signing/lab.keystore.base64 > signing/lab.keystore
          gradle --no-daemon :app:assembleRelease :browser:assembleRelease :canvas:assembleRelease :signalstudio:assembleRelease
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot Android TV and exercise APKs via ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tools/tv_emulator_smoke.py
      - name: Upload screenshots, UI hierarchy, logs, and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-emulator-evidence
          path: tv-emulator-report/
          if-no-files-found: warn
          retention-days: 14
