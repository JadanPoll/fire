plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'dev.jadan.fire.gbaplayer'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.jadan.fire.gbaplayer'
        minSdk 28
        targetSdk 28
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = '0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    lint { disable 'ExpiredTargetSdkVersion' }
    signingConfigs {
        lab {
            storeFile file('../../signing/lab.keystore')
            storePassword 'firetvlab'
            keyAlias 'lab'
            keyPassword 'firetvlab'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.lab }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'com.github.Swordfish90:LibretroDroid:0.13.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    testImplementation 'junit:junit:4.13.2'
}
