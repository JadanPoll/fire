plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.jadan.fire'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.jadan.fire'
        minSdk 28
        targetSdk 28
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = '0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }

    // One authoritative Dojo and capability data source for host tools and TV UI.
    sourceSets {
        main {
            assets.srcDirs += ['../research/android_dojo', '../research/compute', '../research/portability']
        }
    }

    buildFeatures { buildConfig = true }

    // This lab APK targets Fire OS 7 (Android 9) and is sideloaded, not distributed via Google Play.
    // Preserve platform-specific behavior while keeping all other release lint checks enabled.
    lint { disable 'ExpiredTargetSdkVersion' }

    signingConfigs {
        lab {
            storeFile file('../signing/lab.keystore')
            storePassword 'firetvlab'
            keyAlias 'lab'
            keyPassword 'firetvlab'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.lab
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    // Host JVM's Android org.json stubs throw by default; use the real
    // JSON implementation in unit tests without changing the shipped APK.
    testImplementation 'org.json:json:20240303'
}
